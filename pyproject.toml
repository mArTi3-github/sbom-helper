[project]
name = "sbom-helper"
version = "0.1.0"
description = "Resolve Package URLs (PURLs) to source code repository URLs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.7.0",
    "purl2repo>=2.0.0",
    "jinja2>=3.1.0",
    "asyncpg>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "testcontainers[postgres]>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
purl_resolver = ["storage/schema.sql", "templates/*.html"]